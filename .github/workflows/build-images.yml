name: Build and Push Images

on:
  push:
    branches: [main, openshift-v1]

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set image tags
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
            echo "IMAGE_DATE_TAG=$(date +%Y%m%d)" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=v1" >> "$GITHUB_ENV"
            echo "IMAGE_DATE_TAG=v1-$(date +%Y%m%d)" >> "$GITHUB_ENV"
          fi

      - name: Build and push base image (multi-arch)
        run: just base-multiarch

  build-coreos-agent:
    runs-on: ubuntu-latest
    needs: build-base
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set image tags
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
            echo "IMAGE_DATE_TAG=$(date +%Y%m%d)" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=v1" >> "$GITHUB_ENV"
            echo "IMAGE_DATE_TAG=v1-$(date +%Y%m%d)" >> "$GITHUB_ENV"
          fi

      - name: Build and push coreos-agent (multi-arch)
        run: just coreos-agent-multiarch

  build-fedora-agent:
    runs-on: ubuntu-latest
    needs: build-base
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set image tags
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
            echo "IMAGE_DATE_TAG=$(date +%Y%m%d)" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=v1" >> "$GITHUB_ENV"
            echo "IMAGE_DATE_TAG=v1-$(date +%Y%m%d)" >> "$GITHUB_ENV"
          fi

      - name: Build and push fedora-agent (multi-arch)
        run: just fedora-agent-multiarch
