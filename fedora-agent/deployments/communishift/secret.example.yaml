apiVersion: v1
kind: Secret
metadata:
  name: fedora-agent-secrets
  namespace: communishift-coreos-agent
  labels:
    app: fedora-agent
type: Opaque
stringData:
  # Gitea personal access token for forge.fedoraproject.org
  gitea-token: "your-gitea-token-here"
  # GitHub personal access token for the remote github MCP server
  github-token: "your-github-token-here"
  # OpenCode Go subscription key from https://opencode.ai/go
  OPENCODE_API_KEY: "your-opencode-go-key-here"
