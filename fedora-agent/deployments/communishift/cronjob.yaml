apiVersion: batch/v1
kind: CronJob
metadata:
  name: fedora-agent-compose-check
  namespace: communishift-coreos-agent
  labels:
    app: fedora-agent
spec:
  # One sweep per day. The selection window is "today + yesterday", so issues
  # that land after this run (or that a run did not reach before its deadline)
  # are picked up by the next day's sweep instead of being missed.
  schedule: "0 10 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Upper bound on the whole sweep. Set below the 24h schedule and below the
      # worst case (7 issues x 45m); anything not reached is retried by the next
      # sweep because it still has no AI comment.
      activeDeadlineSeconds: 10800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: fedora-agent
            job: compose-check
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
          containers:
            - name: agent
              image: ghcr.io/cverna/fedora-agent:latest
              imagePullPolicy: Always
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail

                  API="https://forge.fedoraproject.org/api/v1/repos/releng/compose-tracker-issues"
                  AI_MARKER="This comment was generated by AI using the"
                  TODAY="$(date -u +%Y%m%d)"
                  YESTERDAY="$(date -u -d yesterday +%Y%m%d)"
                  MODEL="opencode-go/deepseek-v4.1-flash"
                  PREAMBLE="This comment was generated by AI using the [Fedora Skill library](https://forge.fedoraproject.org/ai-ml/skills-library/)
                  Always review AI generated content prior to use"
                  # Per-issue ceiling so one pathological ticket cannot consume
                  # the whole sweep budget.
                  PER_ISSUE_TIMEOUT=2700
                  # The recurrence check only reads Stage 2/3, so it gets a much
                  # smaller ceiling than a full triage.
                  CONFIRM_TIMEOUT=600

                  # Post through the API so the recurrence path does not need a
                  # model run just to write a one-paragraph note.
                  post_comment() {
                    local issue=$1 body=$2
                    jq -n --arg body "$body" '{body:$body}' \
                      | curl -fsS -X POST \
                          -H "Authorization: token $(cat "$GITEA_ACCESS_TOKEN_FILE")" \
                          -H "Content-Type: application/json" \
                          --data @- "$API/issues/$issue/comments" >/dev/null
                  }

                  # === Init: Set up writable home directory ===
                  mkdir -p "$HOME/.config/opencode"

                  # === Init: Copy OpenCode configs from image ===
                  cp /opt/opencode-config/opencode.json "$HOME/.config/opencode/"
                  # OpenShift reserves /run/secrets (SA token + rhsm), so the
                  # GitHub token is mounted at /run/github-secrets instead.
                  sed -i 's#/run/secrets/github-token#/run/github-secrets/github-token#g' "$HOME/.config/opencode/opencode.json"
                  cp /opt/opencode-config/AGENTS.md "$HOME/.config/opencode/"
                  mkdir -p "$HOME/.config/opencode/commands"
                  cp /opt/opencode-commands/*.md "$HOME/.config/opencode/commands/" 2>/dev/null || true
                  mkdir -p "$HOME/.config/opencode/skills"
                  cp -r /opt/opencode-skills/* "$HOME/.config/opencode/skills/"
                  mkdir -p "$HOME/.config/opencode/agents"
                  cp /opt/opencode-agents/*.md "$HOME/.config/opencode/agents/" 2>/dev/null || true
                  mkdir -p "$HOME/.config/opencode/plugins"
                  cp /opt/opencode-config/plugins/*.js "$HOME/.config/opencode/plugins/" 2>/dev/null || true

                  echo "============================================"
                  echo "[$(date)] Fedora compose triage sweep"
                  echo "  window: $YESTERDAY .. $TODAY"
                  echo "============================================"

                  # === Enumerate every compose issue in the window, keeping the
                  #     latest respin per stream. Rawhide, branched, ELN,
                  #     updates-testing, Cloud and Container are all in scope.
                  #     Both FINISHED_INCOMPLETE and DOOMED are triaged (matching
                  #     the previous Rawhide behaviour). ===
                  ISSUES="$(curl -fsS "$API/issues?state=open&limit=50&type=issues&sort=created&direction=desc" \
                    | jq -r --arg d "$TODAY" --arg y "$YESTERDAY" '
                        map(select(.title | test("-(" + $d + "|" + $y + ")\\.")))
                        | map(select(.title | test("(FINISHED_INCOMPLETE|DOOMED)$")))
                        | map(. + {stream: (.title | sub("-?[0-9]{8}.*$"; ""))})
                        | group_by(.stream)
                        | map(max_by(.number))
                        | sort_by(.number)
                        | .[]
                        | "\(.number)\t\(.stream)\t\(.title)"
                      ')"

                  if [ -z "$ISSUES" ]; then
                    echo "No compose issues in window. Nothing to do."
                    exit 0
                  fi

                  echo "Candidate issues:"
                  printf '%s\n' "$ISSUES" | sed 's/^/  /'

                  # === Triage each candidate. One `opencode2 run` per issue means
                  #     one model session per issue: context stays bounded, and a
                  #     failure or timeout cannot abort the rest of the sweep. ===
                  while IFS=$'\t' read -r NUM STREAM TITLE; do
                    [ -n "${NUM:-}" ] || continue

                    COMMENTS="$(curl -fsS "$API/issues/$NUM/comments")" || {
                      echo "WARN #$NUM: could not read comments, leaving for next sweep"
                      continue
                    }
                    if jq -e --arg m "$AI_MARKER" 'any(.[]; .body | contains($m))' <<<"$COMMENTS" >/dev/null; then
                      echo "SKIP #$NUM ($TITLE): already triaged"
                      continue
                    fi

                    # === Recurrence gate: when every artifact failing today
                    #     also failed in a triaged issue of the same stream, a
                    #     short run compares today's cause with that analysis.
                    #     Same cause -> point at it instead of a full triage.
                    #     A changed cause still gets the full run. ===
                    BODY="$(curl -fsS "$API/issues/$NUM" | jq -r '.body // ""')" || BODY=""
                    TODAY_SIG="$(printf '%s' "$BODY" | jq -Rsr '
                        [ scan("\\[FAIL\\][^<\\n]*") ]
                        | map(gsub("Koji task: [0-9]+"; "Koji task: N"))
                        | unique | .[]' 2>/dev/null)" || TODAY_SIG=""

                    if [ -n "$TODAY_SIG" ]; then
                      HIST="$(curl -fsS -G "$API/issues" \
                        --data-urlencode "q=$STREAM" \
                        --data-urlencode "state=all" \
                        --data-urlencode "limit=20" \
                        --data-urlencode "sort=created" \
                        --data-urlencode "direction=desc")" || HIST=""

                      PRIORS="$(printf '%s' "$HIST" | jq -r \
                        --argjson num "$NUM" \
                        --arg stream "$STREAM" \
                        --arg body "$BODY" '
                          def sig($b):
                            [ $b | scan("\\[FAIL\\][^<\\n]*") ]
                            | map(gsub("Koji task: [0-9]+"; "Koji task: N"))
                            | unique;
                          (sig($body)) as $today
                          | if (($today | length) == 0) then empty
                            else
                              [ .[]
                                | select(.number < $num)
                                | select((.title | sub("-?[0-9]{8}.*$"; "")) == $stream)
                                | . + {sig: sig(.body)}
                                | select((.sig | length) > 0 and (($today - .sig) | length) == 0)
                                | {number, title} ]
                              | sort_by(.number)
                              | reverse
                              | .[0:5]
                              | .[]
                              | "\(.number)\t\(.title)"
                            end' 2>/dev/null)" || PRIORS=""

                      PREV=""
                      PREV_TITLE=""
                      while IFS=$'\t' read -r CAND CAND_TITLE; do
                        [ -n "${CAND:-}" ] || continue
                        CAND_COMMENTS="$(curl -fsS "$API/issues/$CAND/comments")" || continue
                        jq -e --arg m "$AI_MARKER" 'any(.[]; .body | contains($m))' <<<"$CAND_COMMENTS" >/dev/null || continue
                        # Skip our own recurring notes: they carry no analysis.
                        jq -e 'any(.[]; .body | contains("<!-- recurring-of:"))' <<<"$CAND_COMMENTS" >/dev/null && continue
                        PREV="$CAND"
                        PREV_TITLE="$CAND_TITLE"
                        break
                      done <<< "$PRIORS"

                      if [ -n "$PREV" ]; then
                        echo "RECURRING CANDIDATE #$NUM -> #$PREV ($PREV_TITLE)"

                        read -r -d '' CONFIRM_PROMPT <<'CONFIRM_EOF' || true
                  You are deciding whether a Fedora compose failure is a repeat of an earlier one. Do not run the full triage.

                  Today's issue: #__NUM__ (__TITLE__) in releng/compose-tracker-issues on forge.fedoraproject.org.
                  Earlier issue with the same failed artifacts: #__PREV__ (__PREV_TITLE__).

                  Step 1 - Read the latest AI analysis comment on #__PREV__ and note the root cause it reports in its ### Affected Images section.
                  Step 2 - Load the fedora-compose-triage skill and follow only Stage 2 (Parse) and Stage 3 (Logs) for issue #__NUM__. Do not run Stage 4-7, do not search Bugzilla, Bodhi or Koji builds, and do not post any comment.
                  Step 3 - Compare today's root cause with the one in #__PREV__. Answer SAME only when the failing artifact has the same root cause, for example the same missing package or the same broken dependency. A different package, a different failure mechanism, or insufficient evidence means DIFFERENT.

                  Your entire final answer must be one line, with no markdown and no other text:
                  RESULT: SAME - <one sentence of evidence>
                  or
                  RESULT: DIFFERENT - <one sentence of evidence>
                  CONFIRM_EOF
                        CONFIRM_PROMPT="${CONFIRM_PROMPT//__TITLE__/$TITLE}"
                        CONFIRM_PROMPT="${CONFIRM_PROMPT//__PREV_TITLE__/$PREV_TITLE}"
                        CONFIRM_PROMPT="${CONFIRM_PROMPT//__NUM__/$NUM}"
                        CONFIRM_PROMPT="${CONFIRM_PROMPT//__PREV__/$PREV}"

                        if ! CONF_OUT="$(timeout "$CONFIRM_TIMEOUT" opencode2 run \
                              --standalone \
                              --auto \
                              --model "$MODEL" \
                              --format json \
                              --title "Recurrence check #${NUM}" \
                              "$CONFIRM_PROMPT" </dev/null)"; then
                          echo "WARN #$NUM: recurrence check failed or timed out, leaving for next sweep"
                          continue
                        fi

                        VERDICT="$(printf '%s\n' "$CONF_OUT" \
                          | jq -r '.part.text? // empty' 2>/dev/null \
                          | tr -d '*_`' \
                          | grep -i 'RESULT:' \
                          | tail -1 \
                          | sed -E 's/.*RESULT:[[:space:]]*([A-Za-z]+).*/\1/' \
                          | tr '[:lower:]' '[:upper:]' || true)"

                        if [ "$VERDICT" = "SAME" ]; then
                          ARTIFACTS="$(printf '%s\n' "$TODAY_SIG" \
                            | sed -E 's/^\[FAIL\][[:space:]]*//; s/ Koji task: N$//' \
                            | sed 's/^/- /')"

                          read -r -d '' RECUR_BODY <<RECUR_EOF || true
                  ${PREAMBLE}

                  ### Recurring failure

                  The same failed artifacts were already triaged in [#${PREV}](https://forge.fedoraproject.org/releng/compose-tracker-issues/issues/${PREV}); the full triage was skipped.

                  ${ARTIFACTS}

                  <!-- recurring-of:${PREV} -->
                  RECUR_EOF

                          if ! post_comment "$NUM" "$RECUR_BODY"; then
                            echo "WARN #$NUM: could not post recurring comment, leaving for next sweep"
                            continue
                          fi
                          echo "SKIP #$NUM ($TITLE): recurring, same cause as #$PREV"
                          continue
                        fi

                        echo "INFO #$NUM: recurrence check found a different cause, running full triage"
                      fi
                    fi

                    echo "--------------------------------------------"
                    echo "TRIAGE #$NUM ($TITLE)"
                    echo "--------------------------------------------"

                    read -r -d '' PROMPT <<PROMPT_EOF || true
                  You are a Fedora compose failure analyst.

                  Triage compose-tracker issue #${NUM} in the releng/compose-tracker-issues repository on forge.fedoraproject.org. Do NOT look for or choose any other issue.

                  Step 1 - Load the fedora-compose-triage skill.

                  Step 2 - Do the skill's Stages 1-3 (Gather, Parse, Logs) with the Code Mode execute tool. In one JavaScript block: read issue #${NUM} and its comments from https://forge.fedoraproject.org/api/v1/repos/releng/compose-tracker-issues/issues/${NUM}; apply the skill's Stage 2 and Stage 3 rules to pick the failing task logs; cache-bust every kojipkgs URL with ?v=<Date.now()>; verify the compose log's COMPOSE_ID matches the compose in the title; fetch the candidate logs in parallel and return only lines matching the skill's fatal markers plus about 5 lines of context, grouped by log. Do not bring whole logs into the conversation. If execute or fetch is unavailable, fall back to the skill's curl commands.

                  Step 3 - Complete the skill's remaining stages (Analyze, Classify, Fixes, Summarize) for issue #${NUM} using that evidence. For Stage 5, get a second opinion from Jev: call the execute tool and inside it call tools.jev.decide with the Stage 2-4 evidence as `state` and one Jev `choice` question named primary_category over dependency, packaging, infrastructure, configuration, tooling and unknown (Jev uses a `criteria` map of value to description). Treat the returned choice as a second opinion: when it disagrees with the evidence, follow the skill and note why. If tools.jev.decide is unavailable, continue without it.

                  Step 4 - Prepare a comment containing ONLY the following, in this exact order:
                  1. This preamble (markdown formatted exactly as shown):
                  This comment was generated by AI using the [Fedora Skill library](https://forge.fedoraproject.org/ai-ml/skills-library/)
                  Always review AI generated content prior to use
                  2. The ### Affected Images section verbatim from the Stage 7 output.
                  3. The ### Related Bugs section verbatim from the Stage 7 output (omit entirely if there are no related bugs).
                  4. The ### Fixes, Updates, and Builds section verbatim from the Stage 7 output (omit entirely if it is empty).
                  Do NOT include any other content, triage stages, parse tables, or analysis.

                  Step 5 - Post the comment using the gitea-mcp MCP server create_issue_comment tool with owner=releng, repo=compose-tracker-issues, index=${NUM}.
                  PROMPT_EOF

                    timeout "$PER_ISSUE_TIMEOUT" opencode2 run \
                      --standalone \
                      --auto \
                      --model "$MODEL" \
                      --format json \
                      --title "Compose triage #${NUM} ${STREAM}" \
                      "$PROMPT" </dev/null || echo "WARN #$NUM: run failed or timed out, leaving for next sweep"
                  done <<< "$ISSUES"

                  echo "============================================"
                  echo "[$(date)] Fedora compose triage sweep complete"
                  echo "============================================"
              env:
                - name: GITEA_ACCESS_TOKEN_FILE
                  value: "/run/gitea-secrets/gitea-token"
                - name: HOME
                  value: "/tmp/agent"
                # OpenCode Go subscription key (https://opencode.ai/go).
                # Required by the paid opencode-go models in $MODEL.
                - name: OPENCODE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fedora-agent-secrets
                      key: OPENCODE_API_KEY
              volumeMounts:
                - name: home
                  mountPath: /tmp/agent
                - name: gitea-token
                  mountPath: /run/gitea-secrets
                  readOnly: true
                - name: github-token
                  mountPath: /run/github-secrets
                  readOnly: true
              resources:
                # Namespace quota is requests: memory 1Gi / cpu 1, so only one
                # pod can run at a time: the sweep is sequential by design.
                requests:
                  memory: 1Gi
                  cpu: 100m
                limits:
                  memory: 6Gi
                  cpu: 500m
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: false
          volumes:
            - name: home
              emptyDir: {}
            - name: gitea-token
              secret:
                secretName: fedora-agent-secrets
                items:
                  - key: gitea-token
                    path: gitea-token
            - name: github-token
              secret:
                secretName: fedora-agent-secrets
                items:
                  - key: github-token
                    path: github-token
